<!doctype html>
<html lang="km">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#011e41">
  <title>ថែមម៉ោង · Overtime</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="../icons/favicon.png">
  <link rel="apple-touch-icon" href="../icons/app-180.png">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="stylesheet" href="ot.css">
  <script>try { var t = localStorage.getItem('fr_theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}</script>
</head>
<body>
  <header class="bar">
    <div class="brand">
      <img class="logo" src="../icons/isi-logo.png" alt="ISI" width="34" height="34">
      <div><b id="title">ថែមម៉ោង</b><small id="sub">ស្នើសុំថែមម៉ោង</small></div>
    </div>
    <div class="bar-right">
      <button type="button" class="icon-btn lang-btn" id="langBtn"></button>
      <button type="button" class="icon-btn" id="themeBtn" aria-label="Light / Dark" title="Light / Dark">🌙</button>
    </div>
  </header>
  <div id="demo" class="demo" hidden></div>

  <main id="view"><div class="spinner" aria-label="Loading"></div></main>

  <nav class="tabs">
    <a href="../" class="tab"><img src="../icons/home.svg" alt="" width="24" height="24"><b data-km="ទំព័រដើម" data-en="Home">ទំព័រដើម</b></a>
    <button type="button" class="tab" data-tab="new"><span aria-hidden="true">➕</span><b data-km="ស្នើថ្មី" data-en="New request">ស្នើថ្មី</b></button>
    <button type="button" class="tab" data-tab="mine"><span aria-hidden="true">📋</span><b data-km="សំណើរបស់ខ្ញុំ" data-en="My requests">សំណើរបស់ខ្ញុំ</b></button>
  </nav>
  <div id="toast" class="toast" role="status" hidden></div>

  <script src="config.js"></script>
  <script src="../lang.js"></script>
  <script src="ot.js"></script>
</body>
</html>
