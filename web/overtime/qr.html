<!doctype html>
<html lang="km">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Department QR · OT</title>
  <link rel="icon" type="image/png" href="../icons/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* One A4 poster per department: scanning it opens the OT form with that department checked. */
    :root { --ink: #011e41; --muted: #546274; --line: #c9d4e2; --bg: #f3f6fa; --brand: #084f6a; --accent: #0b76a0; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 "Noto Sans Khmer", system-ui, sans-serif; }
    .bar { position: sticky; top: 0; display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: #011e41; color: #fff; }
    .bar b { margin-right: auto; font-size: 16px; }
    .bar button, .bar a { font: inherit; color: #fff; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.3); border-radius: 10px; padding: 7px 12px; cursor: pointer; text-decoration: none; }
    .page { width: min(100% - 32px, 560px); margin: 20px auto; background: #fff; border-radius: 18px; border: 1px solid var(--line); padding: 28px 24px; text-align: center; }
    .head { display: flex; align-items: center; justify-content: center; gap: 12px; }
    .head img { width: 54px; height: 54px; border-radius: 50%; }
    .head div { text-align: left; }
    .head b { display: block; font-size: 24px; line-height: 1.2; }
    .head small { color: var(--muted); font-size: 14px; }
    .dept { margin: 18px 0 6px; font-size: 30px; font-weight: 700; color: var(--brand); line-height: 1.25; word-break: break-word; }
    .qr { width: min(100%, 360px); margin: 10px auto; }
    .qr svg { width: 100%; height: auto; display: block; }
    .steps { margin: 14px auto 0; max-width: 420px; font-size: 17px; }
    .steps .en { color: var(--muted); font-size: 14px; }
    .code { margin-top: 16px; font-family: ui-monospace, Menlo, Consolas, monospace; color: var(--muted); font-size: 13px; letter-spacing: .5px; }
    .err { color: #b3261e; font-weight: 700; padding: 30px 0; }
    @media print {
      @page { size: A4; margin: 14mm; }
      body { background: #fff; }
      .bar { display: none; }
      .page { width: auto; margin: 0; border: 3px solid var(--ink); border-radius: 0; padding: 18mm 14mm; }
      .dept { font-size: 40px; }
      .qr { width: 125mm; }
      .steps { font-size: 22px; max-width: none; }
      .steps .en { font-size: 17px; }
    }
  </style>
</head>
<body>
  <div class="bar">
    <b>🖨 QR ផ្នែក · Department QR</b>
    <button type="button" id="print">បោះពុម្ព / Print</button>
  </div>
  <div class="page" id="page"></div>

  <script src="../vendor/qrcode.min.js"></script>
  <script>
  (function () {
    'use strict';
    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const q = new URLSearchParams(location.search);
    const code = String(q.get('d') || '').trim().toUpperCase();
    const name = String(q.get('n') || '').trim();
    const page = document.getElementById('page');
    if (!/^[A-Z0-9-]{3,30}$/.test(code)) {
      page.innerHTML = '<div class="err">គ្មានលេខផ្នែកទេ។ សូមបើកតំណ "Print QR" ពីតារាង OT Departments។<br>No department code. Open the "Print QR" link from the OT Departments tab.</div>';
      return;
    }
    const link = location.origin + location.pathname.replace(/qr\.html$/, '') + '?d=' + encodeURIComponent(code);
    const qr = window.qrcode(0, 'M');
    qr.addData(link); qr.make();
    page.innerHTML = `
      <div class="head"><img src="../icons/isi-logo.png" alt="ISI"><div><b>ថែមម៉ោង</b><small>OT Request</small></div></div>
      <div class="dept">${esc(name || code)}</div>
      <div class="qr">${qr.createSvgTag({ cellSize: 6, margin: 2, scalable: true })}</div>
      <div class="steps">📷 ស្កេន QR នេះ ដើម្បីស្នើសុំថែមម៉ោង<div class="en">Scan this QR code to request overtime</div></div>
      <div class="code">${esc(code)}</div>`;
    document.title = (name || code) + ' · OT QR';
    document.getElementById('print').onclick = () => window.print();
  })();
  </script>
</body>
</html>
