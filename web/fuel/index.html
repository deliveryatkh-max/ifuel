<!doctype html>
<html lang="km">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f4e78">
  <title>Fuel Refill</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="../icons/favicon.png">
  <link rel="apple-touch-icon" href="../icons/app-180.png">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="head">
    <header class="topbar">
      <div class="brand"><span class="logo">⛽</span><div><b id="brandName">ចាក់សាំង</b></div></div>
      <div class="top-right">
        <div class="who" id="who"></div>
        <button type="button" id="langBtn" class="lang-btn"></button>
        <button type="button" id="themeBtn" class="theme-btn" aria-label="Light / Dark" title="Light / Dark">🌙</button>
      </div>
    </header>
    <nav class="navbar" id="navbar" hidden>
      <button type="button" id="navBack" class="nav-btn" aria-label="ថយក្រោយ"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span>ថយក្រោយ</span></button>
      <div class="nav-title" id="navTitle"></div>
      <button type="button" id="navFwd" class="nav-btn fwd" aria-label="ទៅមុខ"><span>ទៅមុខ</span><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </nav>
  </div>

  <div id="demoBanner" class="demo-banner" hidden>DEMO · ទិន្នន័យមិនត្រូវបានរក្សាទុកទេ</div>

  <main id="view"></main>

  <nav class="tabs" id="tabs" hidden>
    <a href="../" class="tab home-tab"><span><img src="../icons/home.svg" alt="" width="24" height="24"></span><b class="lb">ទំព័រដើម</b></a>
    <button data-tab="new" class="tab"><span>➕</span><b class="lb">បញ្ចូលថ្មី</b></button>
    <button data-tab="mine" class="tab"><span>📋</span><b class="lb">របស់ខ្ញុំ</b></button>
    <button data-tab="review" class="tab" id="reviewTab" hidden><span>✅</span><b class="lb">អ្នកត្រួតពិនិត្យ</b></button>
  </nav>

  <nav class="tabs" id="homeOnly">
    <a href="../" class="tab home-tab"><span><img src="../icons/home.svg" alt="" width="24" height="24"></span><b class="lb">ទំព័រដើម</b></a>
  </nav>

  <div id="toast" class="toast" hidden></div>

  <script src="../config.js"></script>
  <script src="../lang.js"></script>
  <script>if (!(window.APP_CONFIG || {}).API_URL) document.write('<script src="demo-data.js"><\/script>');</script>
  <script src="app.js"></script>
</body>
</html>
