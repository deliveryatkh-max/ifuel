<!doctype html>
<html lang="km">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#011e41">
  <title>STEEL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="apple-touch-icon" href="icons/app-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="home.css">
  <script>try { var t = localStorage.getItem('fr_theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}</script>
</head>
<body>
  <header class="bar" id="bar">
    <div class="brand">
      <img class="logo" src="icons/isi-logo.png" alt="ISI" width="34" height="34">
      <div><b>STEEL</b><small class="net" id="net" hidden></small></div>
    </div>
    <div class="bar-right">
      <span class="who" id="who"></span>
      <button type="button" class="icon-btn lang-btn" id="langBtn"></button>
      <button type="button" class="icon-btn" id="themeBtn" aria-label="Light / Dark" title="Light / Dark">🌙</button>
      <button type="button" class="icon-btn" id="outBtn" aria-label="ចាកចេញ" title="ចាកចេញ" hidden>
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M9 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h3M16 17l5-5-5-5M21 12H9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>

  <div class="install" id="install" hidden></div>
  <main id="view"><div class="spinner"></div></main>
  <div id="toast" class="toast" hidden></div>

  <script src="config.js"></script>
  <script src="lang.js"></script>
  <script src="request.js"></script>
  <script src="home.js"></script>
</body>
</html>
