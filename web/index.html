<!doctype html>
<html lang="km">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#011e41">
  <title>iSteel WHL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23011e41'/><g fill='%2361cbf4'><rect x='18' y='18' width='28' height='28' rx='6'/><rect x='54' y='18' width='28' height='28' rx='6'/><rect x='18' y='54' width='28' height='28' rx='6'/><rect x='54' y='54' width='28' height='28' rx='6'/></g></svg>">
  <link rel="stylesheet" href="home.css">
  <script>try { var t = localStorage.getItem('fr_theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}</script>
</head>
<body>
  <header class="bar" id="bar">
    <div class="brand">
      <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><g fill="currentColor"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></g></svg>
      <div><b>iSteel WHL</b><small>កម្មវិធីការងារ · Work apps</small></div>
    </div>
    <div class="bar-right">
      <span class="who" id="who"></span>
      <button type="button" class="icon-btn" id="themeBtn" aria-label="ប្តូរពន្លឺ / Light or dark mode" title="Light / Dark">🌙</button>
      <button type="button" class="icon-btn" id="outBtn" aria-label="ចាកចេញ / Sign out" title="ចាកចេញ / Sign out" hidden>
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M9 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h3M16 17l5-5-5-5M21 12H9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>

  <main id="view"><div class="spinner"></div></main>
  <div id="toast" class="toast" hidden></div>

  <script src="config.js"></script>
  <script src="home.js"></script>
</body>
</html>
