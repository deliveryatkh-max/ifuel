<!doctype html>
<html lang="km">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f4e78">
  <title>Fuel Refill</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛽</text></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="head">
    <header class="topbar">
      <div class="brand"><span class="logo">⛽</span><div><b>ចាក់សាំង</b><small>Fuel Refill</small></div></div>
      <div class="top-right">
        <div class="who" id="who"></div>
        <button type="button" id="themeBtn" class="theme-btn" aria-label="ប្តូរពន្លឺ / Light or dark mode" title="Light / Dark">🌙</button>
      </div>
    </header>
    <nav class="navbar" id="navbar" hidden>
      <button type="button" id="navBack" class="nav-btn" aria-label="ថយក្រោយ / Back"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span>ថយក្រោយ<small>Back</small></span></button>
      <div class="nav-title" id="navTitle"></div>
      <button type="button" id="navFwd" class="nav-btn fwd" aria-label="ទៅមុខ / Forward"><span>ទៅមុខ<small>Forward</small></span><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </nav>
  </div>

  <div id="demoBanner" class="demo-banner" hidden>DEMO · ទិន្នន័យមិនត្រូវបានរក្សាទុកទេ / Nothing is saved</div>

  <main id="view"></main>

  <nav class="tabs" id="tabs" hidden>
    <button data-tab="new" class="tab"><span>➕</span>បញ្ចូលថ្មី<small>New</small></button>
    <button data-tab="mine" class="tab"><span>📋</span>របស់ខ្ញុំ<small>My entries</small></button>
    <button data-tab="review" class="tab" id="reviewTab" hidden><span>✅</span>អ្នកត្រួតពិនិត្យ<small>Reviewer</small></button>
  </nav>

  <div id="toast" class="toast" hidden></div>

  <script src="config.js"></script>
  <script>if (!(window.APP_CONFIG || {}).API_URL) document.write('<script src="demo-data.js"><\/script>');</script>
  <script src="app.js"></script>
</body>
</html>
