<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#011e41">
  <title>Fuel Dashboard</title>
  <link rel="icon" type="image/png" href="../icons/favicon.png">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;600;700&display=swap" rel="stylesheet">
  <script>
    // Same theme choice as the Fuel Refill app; set before paint so there is no flash.
    (function () {
      var t = null; try { t = localStorage.getItem('fr_theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = document.documentElement.getAttribute('data-theme');
      if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <!-- API_URL and GOOGLE_CLIENT_ID come from the Fuel Refill app's own config.js (one folder up). -->
  <script src="../config.js"></script>
  <!-- Keeps the whole site on the phone so it opens at once, even offline (see ../sw.js). -->
  <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('../sw.js').catch(function () {});</script>
  <!-- React, ReactDOM, PropTypes and Recharts are served from this site (vendor/), so no outside server can block them. -->
  <script defer src="./vendor/react.production.min.js"></script>
  <script defer src="./vendor/react-dom.production.min.js"></script>
  <script defer src="./vendor/prop-types.min.js"></script>
  <script defer src="./vendor/Recharts.js"></script>
  <script type="module" crossorigin src="./assets/dashboard.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/dashboard.css">
</head>
<body>
  <div id="root"></div>
</body>
</html>
